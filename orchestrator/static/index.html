<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>영상 편집 파이프라인</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 20px; }
  .step { display: flex; align-items: center; gap: 8px; padding: 6px 0; color: #999; }
  .step.done { color: #1a7f37; }
  .step.active { color: #0969da; font-weight: bold; }
  .step.error { color: #cf222e; }
  #log { background: #f6f8fa; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 12px; white-space: pre-wrap; height: 200px; overflow-y: auto; margin-top: 16px; }
  button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  .checklist { background: #f6f8fa; border-radius: 6px; padding: 12px 16px; margin: 12px 0; }
  .checklist label { display: block; padding: 4px 0; cursor: pointer; }
</style>
</head>
<body>
  <h1>영상 편집 파이프라인 (베타)</h1>

  <div id="start-section">
    <p>시작하기 전에 Premiere Pro에서 아래를 먼저 확인하세요.</p>
    <div class="checklist">
      <label><input type="checkbox" class="pre" /> 프로젝트가 열려 있고, 동기화된 시퀀스가 활성화되어 있다</label>
      <label><input type="checkbox" class="pre" /> 메인 클립이 시퀀스 00:00:00에서 시작한다 (앞부분 트리밍 완료)</label>
      <label><input type="checkbox" class="pre" /> 프로젝트 패널에서 메인 클립을 선택했고, 자막(트랜스크립트)이 이미 생성되어 있다</label>
      <label><input type="checkbox" class="pre" /> MCP Bridge 패널이 열려 있다</label>
    </div>
    <button id="startBtn" disabled>시작</button>
  </div>

  <div id="status-section" style="display:none; margin-top: 24px;">
    <div class="step" data-step="1">1. 자막 가져오기 (get_transcript)</div>
    <div class="step" data-step="2">2. 삭제 후보 탐지 (detect_deletions)</div>
    <div class="step" data-step="3">3. 마커 표시 (place_markers)</div>
    <div id="log"></div>
    <button id="resumeBtn" style="display:none;">재시작 (실패 지점부터)</button>
  </div>

<script>
let currentJobId = null;
let pollHandle = null;

const startBtn = document.getElementById("startBtn");
const checks = document.querySelectorAll(".pre");
checks.forEach(c => c.onchange = () => {
  startBtn.disabled = ![...checks].every(x => x.checked);
});

startBtn.onclick = async () => {
  startBtn.disabled = true;
  const res = await fetch("/jobs", { method: "POST" });
  const data = await res.json();
  if (data.error) { alert(data.error); startBtn.disabled = false; return; }

  currentJobId = data.job_id;
  document.getElementById("start-section").style.display = "none";
  document.getElementById("status-section").style.display = "block";
  startPolling();
};

document.getElementById("resumeBtn").onclick = async () => {
  await fetch(`/jobs/${currentJobId}/resume`, { method: "POST" });
  document.getElementById("resumeBtn").style.display = "none";
  startPolling();
};

function startPolling() {
  clearInterval(pollHandle);
  pollHandle = setInterval(pollStatus, 2000);
  pollStatus();
}

async function pollStatus() {
  const res = await fetch(`/jobs/${currentJobId}`);
  const job = await res.json();

  document.querySelectorAll(".step").forEach(el => {
    const stepNum = parseInt(el.dataset.step, 10);
    el.classList.remove("done", "active", "error");
    if (job.status === "error" && stepNum === job.step + 1) {
      el.classList.add("error");
    } else if (stepNum <= job.step) {
      el.classList.add("done");
    } else if (stepNum === job.step + 1 && job.status === "running") {
      el.classList.add("active");
    }
  });

  document.getElementById("log").textContent = job.log.join("\n");

  if (job.status === "done") {
    clearInterval(pollHandle);
    document.getElementById("log").textContent += "\n\n✅ 완료! Premiere에서 마커를 확인하세요.";
  } else if (job.status === "error") {
    clearInterval(pollHandle);
    document.getElementById("resumeBtn").style.display = "inline-block";
  }
}
</script>
</body>
</html>
